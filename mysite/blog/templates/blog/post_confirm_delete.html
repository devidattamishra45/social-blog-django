{% extends "blog/base.html" %}

{% block title %}Delete {{ post.title }}{% endblock %}

{% block content %}
<div class="form-card delete-confirm-card">
  <h1>Delete Post</h1>
  <p class="delete-warning">Are you sure you want to delete the article <strong>"{{ post.title }}"</strong>?</p>
  <p class="delete-sub-warning">This action is permanent and cannot be undone.</p>

  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <button type="submit" class="btn btn-danger">Confirm Delete</button>
      <a href="{% url 'blog:dashboard_view' %}" class="btn btn-secondary">Cancel and Return</a>
    </div>
  </form>
</div>
{% endblock %}
